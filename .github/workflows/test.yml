name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package
        run: pip install -e ".[dev]"

      # Guards the failure mode that shipped once already: modules committed to
      # the repo root instead of into slidescribe/, which builds an empty wheel
      # that pip installs "successfully" and that fails only on import.
      - name: Verify the package is importable
        run: |
          cd /tmp
          python -c "import slidescribe; print('slidescribe', slidescribe.__version__)"
          python -c "from slidescribe import process_video, Config, LLMConfig"
          python -c "from slidescribe.llm import LLMClient"

      - name: Verify the CLI is wired up
        run: slidescribe --help

      - name: Run tests
        run: pytest -q
